<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Juoksuseuranta</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
    <h1>Juoksuseuranta</h1>
</header>

<div class="toast" id="toast"></div>

<!-- Lisää juoksu -->
<div class="page active" id="page-add">
    <div class="container">
        <div class="card">
            <h2>Uusi juoksu</h2>
            <form id="run-form">
                <div class="form-group">
                    <label>Päivämäärä</label>
                    <input type="date" id="run-date" required>
                </div>
                <div class="form-group">
                    <label>Matka (km)</label>
                    <div class="distance-row">
                        <select id="run-distance-preset" class="select-input">
                            <option value="">Valitse...</option>
                            <option value="1">1 km</option>
                            <option value="2">2 km</option>
                            <option value="3">3 km</option>
                            <option value="5">5 km</option>
                            <option value="7">7 km</option>
                            <option value="10">10 km</option>
                            <option value="15">15 km</option>
                            <option value="21.1">Puolimaraton</option>
                            <option value="42.2">Maraton</option>
                            <option value="custom">Muu...</option>
                        </select>
                        <input type="number" id="run-distance" step="0.01" min="0.01" placeholder="km" class="distance-custom" style="display:none" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Kesto</label>
                    <div class="duration-inputs">
                        <div class="form-group">
                            <select id="run-hours" class="select-input">
                                <option value="0">0 h</option>
                                <option value="1">1 h</option>
                                <option value="2">2 h</option>
                                <option value="3">3 h</option>
                                <option value="4">4 h</option>
                                <option value="5">5 h</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <select id="run-minutes" class="select-input" required></select>
                        </div>
                        <div class="form-group">
                            <select id="run-seconds" class="select-input"></select>
                        </div>
                    </div>
                </div>
                <div class="pace-display" id="pace-display"></div>
                <br>
                <button type="submit" class="btn btn-primary">Tallenna juoksu</button>
            </form>
        </div>
    </div>
</div>

<!-- Historia -->
<div class="page" id="page-history">
    <div class="container">
        <div class="card">
            <h2>Juoksuhistoria</h2>
            <div id="run-list" class="run-list-scroll"></div>
        </div>
    </div>
</div>

<!-- Tilastot -->
<div class="page" id="page-stats">
    <div class="container">
        <div class="stats-grid" id="stats-summary"></div>
        <div class="card">
            <h2>Kilometrit</h2>
            <div class="period-toggle">
                <button class="period-btn active" data-period="week">Viikko</button>
                <button class="period-btn" data-period="month">Kuukausi</button>
            </div>
            <div class="chart-container">
                <canvas id="distance-chart"></canvas>
            </div>
        </div>
        <div class="card">
            <h2>Vauhti (min/km)</h2>
            <div class="chart-container">
                <canvas id="pace-chart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Navigation -->
<nav>
    <button class="active" data-page="page-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Lisää
    </button>
    <button data-page="page-history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Historia
    </button>
    <button data-page="page-stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Tilastot
    </button>
</nav>

<script src="js/firebase-config.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>

</body>
</html>
